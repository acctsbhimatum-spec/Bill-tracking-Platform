/* ---------------- event wiring ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggle;
      expandedId = expandedId===id ? null : id;
      render();
    });
  });

  document.querySelectorAll('.billSelect').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.dataset.bill;
      if(cb.checked) selectedBillIds.add(id); else selectedBillIds.delete(id);
      render();
    });
  });
  const selectAllEl = document.getElementById('selectAllBills');
  if(selectAllEl){
    selectAllEl.addEventListener('change', ()=>{
      const ids = myProcessorBillIds();
      if(selectAllEl.checked) ids.forEach(id=>selectedBillIds.add(id));
      else ids.forEach(id=>selectedBillIds.delete(id));
      render();
    });
  }
  const bulkMarkBtn = document.getElementById('btnBulkMark');
  if(bulkMarkBtn){
    bulkMarkBtn.addEventListener('click', async ()=>{
      const deptSel = document.getElementById('bulkMarkSelect');
      const remarkEl = document.getElementById('bulkRemark');
      const ids = myProcessorBillIds().filter(id=>selectedBillIds.has(id));
      if(!ids.length) return;
      ids.forEach(id=> markForward(id, deptSel.value, remarkEl.value));
      selectedBillIds.clear();
      await persistAndRender(`Marked ${ids.length} bill${ids.length===1?'':'s'} on to ` + deptById(deptSel.value).name + '.');
    });
  }

  const form = document.getElementById('billForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      if(!data.billNo || !data.vendor || !data.amount || !data.billDate || !data.description || !data.department){
        flashNotice('Please fill in all required fields, including the department to send it to.', true);
        return;
      }
      submitBill(data);
      form.reset();
      await persistAndRender('Bill ' + data.billNo + ' logged and sent to ' + deptById(data.department).name + '.');
    });
  }

  document.querySelectorAll('.btnAcknowledge').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const remarkEl = document.querySelector(`.remarkInput[data-bill="${billId}"]`);
      acknowledgeBill(billId, remarkEl ? remarkEl.value : '');
      await persistAndRender('Receipt acknowledged.');
    });
  });
  document.querySelectorAll('.paymentForm').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const billId = form.dataset.bill;
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      if(!data.paymentType || !data.bankAccount || !data.paidOn){
        flashNotice('Please fill in payment type, bank account and date of payment.', true);
        return;
      }
      recordPayment(billId, data);
      await persistAndRender('Payment recorded for bill.');
    });
  });
  document.querySelectorAll('.btnSendBranchPay').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      sendToBranchForPayment(billId, 'Sent to branch for local payment');
      await persistAndRender('Sent to the branch for payment.');
    });
  });

  document.querySelectorAll('.btnMark').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const sel = document.querySelector(`.markToSelect[data-bill="${billId}"]`);
      const remarkEl = document.querySelector(`.remarkInput[data-bill="${billId}"]`);
      markForward(billId, sel.value, remarkEl.value);
      await persistAndRender('Marked on to ' + deptById(sel.value).name + '.');
    });
  });
  document.querySelectorAll('.btnReturn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const selectEl = document.querySelector(`.returnToSelect[data-bill="${billId}"]`);
      const remarkEl = document.querySelector(`.returnRemarkInput[data-bill="${billId}"]`);
      if(!remarkEl.value.trim()){ flashNotice('Add a reason explaining what needs correction.', true); return; }
      const idx = selectEl.value.indexOf('::');
      const targetType = selectEl.value.slice(0, idx);
      const targetId = selectEl.value.slice(idx+2);
      const targetName = targetType==='branch' ? targetId : (deptById(targetId)?.name || targetId);
      returnBillTo(billId, targetType, targetId, remarkEl.value);
      await persistAndRender('Returned to ' + targetName + ' for correction.');
    });
  });
  document.querySelectorAll('.btnApprove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const remarkEl = document.querySelector(`.remarkInput[data-bill="${billId}"]`);
      approveBill(billId, remarkEl.value);
      await persistAndRender('Bill approved.');
    });
  });
  document.querySelectorAll('.btnReject').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const remarkEl = document.querySelector(`.remarkInput[data-bill="${billId}"]`);
      if(!remarkEl.value.trim()){ flashNotice('Add a remark explaining the rejection.', true); return; }
      rejectBill(billId, remarkEl.value);
      await persistAndRender('Bill rejected.');
    });
  });
  document.querySelectorAll('.btnResubmit').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const billId = btn.dataset.bill;
      const bill = bills.find(b=>b.id===billId);
      const remarkEl = document.querySelector(`.remarkInput[data-bill="${billId}"]`);
      const deptName = deptById(bill.returnedFromDept)?.name || 'the department';
      if(bill.status==='rejected') resubmitRejected(billId, remarkEl.value);
      else resubmit(billId, remarkEl.value);
      await persistAndRender('Resubmitted to ' + deptName + '.');
    });
  });

  document.querySelectorAll('.btnEdit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingBillId = btn.dataset.bill;
      render();
    });
  });
  document.querySelectorAll('.btnCancelEdit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingBillId = null;
      render();
    });
  });
  document.querySelectorAll('.editForm').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const billId = form.dataset.bill;
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      if(!data.billNo || !data.vendor || !data.amount || !data.billDate || !data.description){
        flashNotice('Please fill in all fields before saving.', true);
        return;
      }
      editBill(billId, data);
      editingBillId = null;
      await persistAndRender('Bill details updated.');
    });
  });

  document.querySelectorAll('.btnResetPw').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.user;
      users[key].password = DEFAULT_PASSWORD;
      const ok = await saveUsers();
      render();
      flashNotice(ok ? (users[key].name + ' reset to the default password (0000).') : '⚠ Could not save — check your connection and try again.', !ok);
    });
  });

  const addBranchForm = document.getElementById('addBranchForm');
  if(addBranchForm){
    addBranchForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(addBranchForm);
      const name = fd.get('branchName') || '';
      if(!addBranch(String(name))){ render(); return; }
      const ok1 = await saveOrgStructure();
      const ok2 = await saveUsers();
      render();
      flashNotice((ok1 && ok2) ? (name.trim() + ' added, with Accounts and Marketing logins ready on password 0000.') : '⚠ Could not save — check your connection and try again.', !(ok1 && ok2));
    });
  }
  const addDeptForm = document.getElementById('addDeptForm');
  if(addDeptForm){
    addDeptForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(addDeptForm);
      const name = fd.get('deptName') || '';
      const canEnter = fd.get('canEnterBills') === 'on';
      if(!addDepartment(String(name), canEnter)){ render(); return; }
      const ok1 = await saveOrgStructure();
      const ok2 = await saveUsers();
      render();
      flashNotice((ok1 && ok2) ? (name.trim() + ' added under Corporate, login ready on password 0000.') : '⚠ Could not save — check your connection and try again.', !(ok1 && ok2));
    });
  }

  const clearBillsConfirmInput = document.getElementById('clearBillsConfirm');
  const clearBillsBtn = document.getElementById('btnClearBills');
  if(clearBillsConfirmInput && clearBillsBtn){
    clearBillsConfirmInput.addEventListener('input', ()=>{
      clearBillsBtn.disabled = clearBillsConfirmInput.value.trim() !== 'CLEAR ALL BILLS';
    });
  }
  const clearBillsForm = document.getElementById('clearBillsForm');
  if(clearBillsForm){
    clearBillsForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(clearBillsConfirmInput.value.trim() !== 'CLEAR ALL BILLS') return;
      const total = bills.length;
      const ok = await clearAllBills();
      render();
      flashNotice(ok ? `All ${total} bill${total===1?'':'s'} cleared from the register.` : '⚠ Could not save — check your connection and try again.', !ok);
    });
  }

  document.querySelectorAll('.stat-card[data-goto-status]').forEach(card=>{
    card.addEventListener('click', ()=>{
      trackFilters = {q:'', status:card.dataset.gotoStatus, dept:'all', branch:'all'};
      tab = 'track';
      expandedId = null;
      selectedBillIds.clear();
      render();
    });
  });
  document.querySelectorAll('.dept-load-item[data-goto-dept]').forEach(row=>{
    row.addEventListener('click', ()=>{
      trackFilters = {q:'', status:'with_department', dept:row.dataset.gotoDept, branch:'all'};
      tab = 'track';
      expandedId = null;
      selectedBillIds.clear();
      render();
    });
  });

  document.querySelectorAll('.dept-subtab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      deptTab = btn.dataset.dept;
      expandedId = null;
      selectedBillIds.clear();
      render();
    });
  });

  const dlBtn = document.getElementById('btnDownloadTemplate');
  if(dlBtn) dlBtn.addEventListener('click', downloadTemplate);

  const fileInput = document.getElementById('excelFileInput');
  if(fileInput) fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(f) handleExcelFile(f);
  });

  const confirmImportBtn = document.getElementById('btnConfirmImport');
  if(confirmImportBtn) confirmImportBtn.addEventListener('click', confirmImport);

  const cancelImportBtn = document.getElementById('btnCancelImport');
  if(cancelImportBtn) cancelImportBtn.addEventListener('click', clearImport);

  const searchEl = document.getElementById('trackSearch');
  if(searchEl){
    searchEl.addEventListener('input', ()=>{
      const pos = searchEl.selectionStart;
      trackFilters.q = searchEl.value;
      render();
      const el2 = document.getElementById('trackSearch');
      if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
    });
  }
  const statusEl = document.getElementById('trackStatus');
  if(statusEl) statusEl.addEventListener('change', ()=>{ trackFilters.status = statusEl.value; render(); });
  const deptEl = document.getElementById('trackDept');
  if(deptEl) deptEl.addEventListener('change', ()=>{ trackFilters.dept = deptEl.value; render(); });
  const branchEl = document.getElementById('trackBranch');
  if(branchEl) branchEl.addEventListener('change', ()=>{ trackFilters.branch = branchEl.value; render(); });
  const resetFiltersBtn = document.getElementById('btnResetFilters');
  if(resetFiltersBtn) resetFiltersBtn.addEventListener('click', ()=>{
    trackFilters = {q:'', status:'all', dept:'all', branch:'all'};
    render();
  });
  const exportCsvBtn = document.getElementById('btnExportCsv');
  if(exportCsvBtn) exportCsvBtn.addEventListener('click', ()=>{
    const list = filteredTrackBills();
    if(!list.length){ flashNotice('Nothing to export with the current filters.', true); return; }
    exportBillsToCSV(list);
  });
}

/* ---------------- init ---------------- */
function renderLoadingScreen(){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="surface login-card" style="text-align:center;">
        <div class="login-brand" style="margin-bottom:8px;">
          <span class="brand-icon login-brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M9 13.5l2 2 4-4.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-sub">Bill Movement &amp; Approval Register</span>
        </div>
        <p class="login-hint" style="margin-top:18px;">Connecting to the register…</p>
      </div>
    </div>
  `;
}

let billsPrefetch = null;
async function init(){
  renderLoadingScreen();
  await loadOrgAndUsers();
  billsPrefetch = loadBills(); // keep loading in the background while the person picks their login
  renderLogin();
}
init();
</script>
</body>
</html>
