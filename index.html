<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Movement & Approval Register</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#EDEAE0;
  --ink-soft:#9B9788;
  --paper:#0E0D0A;
  --paper-raised:#18160F;
  --paper-deep:#211E14;
  --rule:#2C2818;
  --rule-strong:#433C22;
  --accent:#F2C158;
  --accent-strong:#E0A72E;
  --accent-ink:#161307;
  --accent-soft:#2A2110;
  --pending:#4FB3D9;
  --pending-soft:#11212B;
  --approved:#34D399;
  --approved-soft:#0F2B22;
  --hold:#E0873C;
  --hold-soft:#2E2010;
  --rejected:#F87171;
  --rejected-soft:#2C1717;
  --white:#FFFFFF;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(242,193,88,0.06), transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.app{
  position:relative;
  width:100%;
  max-width:1800px;
  margin:0 auto;
  padding:0 clamp(16px, 3.5vw, 64px) 80px clamp(16px, 3.5vw, 64px);
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
  padding:24px 0 18px 0;
}
.topbar-main{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.avatar-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  width:50px;
  height:50px;
  border-radius:50%;
  border:2px solid var(--accent);
  color:var(--accent);
  font-family:'Inter', sans-serif;
  font-weight:800;
  font-size:16px;
  letter-spacing:0.3px;
  flex-shrink:0;
}
.topbar-titles{display:flex; flex-direction:column; gap:2px;}
.topbar-title{
  font-family:'Inter', sans-serif;
  font-size:21px;
  font-weight:800;
  color:var(--ink);
  letter-spacing:-0.01em;
}
.topbar-subtitle{
  font-size:12px;
  font-weight:700;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:0.7px;
}
.topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.topbar-divider{height:3px; background:var(--accent); border-radius:2px; margin-bottom:4px;}

.role-pill{
  display:inline-flex;
  align-items:center;
  border:1.5px solid var(--accent);
  color:var(--accent);
  border-radius:20px;
  padding:7px 14px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  white-space:nowrap;
}
.user-pill{
  display:inline-flex;
  align-items:center;
  background:var(--accent-strong);
  color:var(--accent-ink);
  border-radius:20px;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.brand-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg, var(--accent), var(--accent-strong));
  flex-shrink:0;
}
.login-brand-icon{width:44px; height:44px; border-radius:12px; margin:0 auto 14px auto;}
.brand-sub{
  font-family:'Inter', sans-serif;
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-0.01em;
}

label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  color:var(--ink-soft);
  font-weight:600;
}
select, input, textarea{
  font-family:'Inter', sans-serif;
  font-size:14.5px;
  color:var(--ink);
  background:var(--paper-deep);
  border:1.5px solid var(--rule-strong);
  border-radius:7px;
  padding:9px 11px;
}
select:focus, input:focus, textarea:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

/* ---------- Tabs ---------- */
.tabs{
  display:flex;
  gap:2px;
  margin-top:22px;
  flex-wrap:wrap;
}
.tab{
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:13.5px;
  letter-spacing:0.1px;
  background:transparent;
  border:none;
  border-radius:7px 7px 0 0;
  border-bottom:2px solid transparent;
  color:var(--ink-soft);
  padding:10px 16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:background 0.12s ease, color 0.12s ease;
}
.tab:hover{color:var(--ink); background:var(--paper-raised);}
.tab.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
  background:var(--paper-raised);
}
.tab .count{
  background:var(--paper-deep);
  color:var(--ink-soft);
  border-radius:6px;
  padding:1px 7px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
}
.tab.active .count{background:var(--accent-soft); color:var(--accent);}

.tabs.subtabs{
  margin-top:0;
  margin-bottom:22px;
  gap:8px;
  border-bottom:1px solid var(--rule);
  padding-bottom:14px;
}
.tabs.subtabs .tab{
  background:var(--paper-raised);
  border:1px solid var(--rule-strong);
  border-radius:7px;
  padding:7px 14px;
  font-size:12.5px;
}
.tabs.subtabs .tab.active{
  background:var(--accent-strong);
  border-color:var(--accent-strong);
  color:var(--accent-ink);
}
.tabs.subtabs .tab.active .count{background:rgba(22,19,7,0.18); color:var(--accent-ink);}

main{padding-top:26px;}

.panel-title{
  font-family:'Inter', sans-serif;
  font-size:21px;
  font-weight:700;
  letter-spacing:-0.015em;
  margin:0 0 4px 0;
}
.panel-sub{
  color:var(--ink-soft);
  font-size:14px;
  margin:0 0 24px 0;
  max-width:640px;
  line-height:1.5;
}

/* ---------- Card / surfaces ---------- */
.surface{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-radius:10px;
  box-shadow:var(--shadow);
}

/* ---------- Login screen ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:400px;
  padding:34px 32px 30px 32px;
}
.login-brand{
  text-align:center;
  margin-bottom:22px;
}
.login-brand .brand-sub{font-size:19px; display:block;}
.login-field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.login-field select, .login-field input{width:100%; padding:11px 12px; font-size:15px;}
.login-error{
  background:var(--rejected-soft);
  color:var(--rejected);
  border:1px solid var(--rejected);
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;
  font-weight:600;
  margin-bottom:14px;
}
.login-hint{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:16px;
  line-height:1.6;
  text-align:center;
}
button.primary.wide{width:100%; padding:12px; font-size:14.5px;}

/* ---------- Dashboard ---------- */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
  gap:12px;
  margin-bottom:28px;
}
.stat-card{
  padding:16px 18px;
  border-top:3px solid var(--accent);
}
.stat-card.clickable{
  cursor:pointer;
  transition:transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
}
.stat-card.clickable:hover{
  background:var(--paper-deep);
  transform:translateY(-2px);
}
.stat-card .num{
  font-family:'IBM Plex Mono', monospace;
  font-size:26px;
  font-weight:600;
}
.stat-card .lbl{
  font-size:12px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.8px;
  margin-top:2px;
}
.stat-card.pending{border-color:var(--pending);}
.stat-card.approved{border-color:var(--approved);}
.stat-card.hold{border-color:var(--hold);}
.stat-card.rejected{border-color:var(--rejected);}

.dept-load{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(210px,1fr));
  gap:10px;
  margin-bottom:30px;
}
.dept-load-item{
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:background 0.1s ease;
}
.dept-load-item:hover{background:var(--paper-deep);}
.dept-load-item .name{font-size:13.5px; font-weight:600;}
.dept-load-item .n{
  font-family:'IBM Plex Mono', monospace;
  background:var(--accent-soft);
  color:var(--accent);
  border-radius:12px;
  padding:2px 10px;
  font-size:13px;
  font-weight:600;
}

.section-h{
  font-family:'Inter', sans-serif;
  font-size:15px;
  font-weight:700;
  margin:0 0 12px 0;
  color:var(--ink);
}

.feed{padding:6px 0;}
.feed-item{
  display:flex;
  gap:12px;
  padding:12px 18px;
  border-bottom:1px solid var(--rule);
  font-size:13.5px;
  align-items:baseline;
}
.feed-item:last-child{border-bottom:none;}
.feed-item .time{
  font-family:'IBM Plex Mono', monospace;
  color:var(--ink-soft);
  font-size:11.5px;
  white-space:nowrap;
  min-width:76px;
}
.empty{
  padding:40px 24px;
  text-align:center;
  color:var(--ink-soft);
  font-size:14px;
  line-height:1.6;
}
.empty b{color:var(--ink); display:block; font-family:'Inter',sans-serif; font-size:16px; margin-bottom:6px;}

/* ---------- Form ---------- */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px 20px;
  padding:26px;
}
.field{display:flex; flex-direction:column; gap:6px;}
.field.full{grid-column:1 / -1;}
.field label{
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.6px;
  color:var(--ink-soft);
}
.field .hint{font-size:11.5px; color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:0;}
textarea{resize:vertical; min-height:64px; font-family:'Inter',sans-serif;}
.form-actions{
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:6px;
  border-top:1px solid var(--rule);
  margin-top:4px;
}
.form-note{font-size:12.5px; color:var(--ink-soft);}

button.primary{
  font-family:'Inter', sans-serif;
  font-weight:700;
  font-size:14px;
  background:var(--accent-strong);
  color:var(--accent-ink);
  border:none;
  border-radius:7px;
  padding:10px 20px;
  cursor:pointer;
  transition:background 0.12s ease, transform 0.05s ease;
}
button.primary:hover{background:var(--accent);}
button.primary:active{transform:translateY(1px);}
button.ghost{
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:13px;
  background:transparent;
  color:var(--ink-soft);
  border:1.5px solid var(--rule-strong);
  border-radius:7px;
  padding:9px 16px;
  cursor:pointer;
  transition:border-color 0.12s ease, color 0.12s ease;
}
button.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
button.small{padding:6px 12px; font-size:12.5px;}
button.link{
  background:none; border:none; cursor:pointer;
  font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
  color:var(--accent); text-decoration:underline; padding:4px 0;
}

.notice{
  display:none;
  background:var(--approved-soft);
  color:var(--approved);
  border:1px solid var(--approved);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  margin-bottom:16px;
}
.notice.show{display:block;}
.notice.error{background:var(--rejected-soft); color:var(--rejected); border-color:var(--rejected);}

.role-block{
  padding:40px 24px;
  text-align:center;
}

/* ---------- Bill list / cards ---------- */
.filter-panel{
  padding:20px 22px;
  margin-bottom:20px;
  border-top:3px solid var(--accent);
}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:0;
}
.filters input, .filters select{padding:8px 10px; font-size:13px;}
.filters input{flex:1; min-width:180px;}

.bulk-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding:12px 18px;
  margin-bottom:14px;
  border-left:4px solid var(--accent);
}
.bulk-select-all{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.bulk-select{padding:8px 10px; font-size:13px; min-width:180px;}
.bulk-remark{padding:8px 10px; font-size:13px; flex:1; min-width:200px;}
.bill-check{
  display:flex;
  align-items:center;
  padding-top:2px;
  cursor:pointer;
}
.bill-check input{cursor:pointer; width:16px; height:16px;}

.bill-card{
  border-bottom:1px solid var(--rule);
  padding:16px 20px;
}
.bill-card:last-child{border-bottom:none;}
.bill-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  cursor:pointer;
  flex-wrap:wrap;
}
.bill-id{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:var(--ink-soft);
}
.bill-title{
  font-weight:600;
  font-size:15px;
  margin-top:2px;
}
.bill-meta{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:3px;
}
.bill-amount{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:16px;
  white-space:nowrap;
}
.pill{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  padding:4px 10px;
  border-radius:6px;
  white-space:nowrap;
}
.pill.pending{background:var(--pending-soft); color:var(--pending);}
.pill.approved{background:var(--approved-soft); color:var(--approved);}
.pill.hold{background:var(--hold-soft); color:var(--hold);}
.pill.rejected{background:var(--rejected-soft); color:var(--rejected);}
.pill.due-ontrack{background:var(--paper-deep); color:var(--ink-soft);}
.pill.due-duesoon{background:var(--hold-soft); color:var(--hold);}
.pill.due-overdue{background:var(--rejected-soft); color:var(--rejected); font-weight:700;}

.bill-detail{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--rule);
  display:none;
}
.bill-detail.open{display:block;}

/* workflow trail */
.trail{
  display:flex;
  align-items:flex-start;
  gap:0;
  overflow-x:auto;
  padding:10px 2px 18px 2px;
}
.trail-node{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:96px;
  position:relative;
}
.trail-node:not(:last-child)::after{
  content:'';
  position:absolute;
  top:19px;
  left:calc(50% + 22px);
  width:calc(100% - 12px);
  border-top:1.5px solid var(--rule-strong);
}
.stamp{
  width:38px; height:38px;
  border-radius:9px;
  border:1.5px solid currentColor;
  background:color-mix(in srgb, currentColor 14%, var(--paper-raised));
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono', monospace;
  font-weight:700;
  font-size:11px;
  letter-spacing:0.2px;
  position:relative;
  z-index:1;
}
.stamp.c-pending{color:var(--pending);}
.stamp.c-hold{color:var(--hold);}
.stamp.c-approved{color:var(--approved);}
.stamp.c-rejected{color:var(--rejected);}

.trail-label{
  margin-top:8px;
  font-size:11px;
  text-align:center;
  color:var(--ink);
  font-weight:600;
  line-height:1.3;
  max-width:100px;
}
.trail-date{
  font-size:10.5px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  margin-top:2px;
}
.trail-remark{
  font-size:10.5px;
  color:var(--ink-soft);
  margin-top:3px;
  max-width:104px;
  text-align:center;
  line-height:1.3;
}

.bill-desc{
  font-size:13px;
  color:var(--ink-soft);
  background:var(--paper);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:16px;
  line-height:1.5;
}

.action-box{
  background:var(--accent-soft);
  border-radius:8px;
  padding:16px;
  border:1px solid #453A72;
}
.action-box .section-h{color:var(--accent);}
.action-box.ack-box{background:var(--hold-soft); border-color:var(--hold);}
.action-box.ack-box .section-h{color:var(--hold);}
.action-box.payment-box{background:var(--approved-soft); border-color:var(--approved);}
.action-box.payment-box .section-h{color:var(--approved);}
.action-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-end;
  margin-top:10px;
}
.action-row .field{min-width:200px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

/* ---------- Manage logins (admin) ---------- */
.user-table{width:100%; border-collapse:collapse;}
.user-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
  color:var(--ink-soft); padding:10px 18px; border-bottom:1px solid var(--rule-strong);
}
.user-table td{padding:11px 18px; border-bottom:1px solid var(--rule); font-size:13.5px; vertical-align:middle;}
.user-table tr:last-child td{border-bottom:none;}
.role-tag{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
  background:var(--paper-deep); color:var(--ink-soft); padding:3px 8px; border-radius:9px;
}

.pw-panel{
  padding:18px 22px;
  max-width:380px;
}
.pw-panel .field{margin-bottom:12px;}

footer{
  margin-top:50px;
  padding-top:18px;
  border-top:1px solid var(--rule);
  font-size:11.5px;
  color:var(--ink-soft);
  line-height:1.6;
}

@media (max-width:680px){
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ---------------- helpers ---------------- */
function deptById(id){ return DEPARTMENTS.find(d=>d.id===id); }
function uid(p){ return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ return '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
function fmtDateOnly(dateStr){
  if(!dateStr) return '—';
  const parts = String(dateStr).split('-');
  if(parts.length!==3) return fmtDate(dateStr);
  const [y, m, d] = parts.map(Number);
  const dt = new Date(y, m-1, d); // built from local Y/M/D directly — never shifts a day via UTC parsing
  return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function roleLabel(type){ return type==='branch'?'Branch':(type==='admin'?'Administrator':'Corporate'); }
function canEnterBills(){
  if(session.type==='branch') return true;
  if(session.type==='department'){
    const d = deptById(session.id);
    return !!(d && d.canEnterBills);
  }
  return false;
}
function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'dept';
}
function codeFromName(name){
  const words = name.trim().split(/\s+/).filter(Boolean);
  let code = words.length>1 ? words.map(w=>w[0]).join('') : name.slice(0,3);
  return code.toUpperCase().slice(0,4);
}

/* ---------------- default users ---------------- */
function buildDefaultUsers(){
  const u = {};
  BRANCHES.forEach(b=>{
    BRANCH_SUBDEPTS.forEach(sd=>{
      const key = b + '::' + sd.id;
      u[key] = {password:DEFAULT_PASSWORD, type:'branch', name: b + ' — ' + sd.name, branch:b, branchDept:sd.id};
    });
  });
  DEPARTMENTS.forEach(d=>{ u[d.id] = {password:DEFAULT_PASSWORD, type:'department', name:d.name}; });
  u['admin'] = {password:DEFAULT_PASSWORD, type:'admin', name:'Administrator'};
  return u;
}

/* ---------------- org structure mutations (admin) ---------------- */
function addBranch(name){
  const trimmed = name.trim();
  if(!trimmed){ addBranchError = 'Enter a branch name.'; return false; }
  if(BRANCHES.some(b=>b.toLowerCase()===trimmed.toLowerCase())){ addBranchError = 'A branch with that name already exists.'; return false; }
  BRANCHES.push(trimmed);
  BRANCH_SUBDEPTS.forEach(sd=>{
    const key = trimmed + '::' + sd.id;
    users[key] = {password:DEFAULT_PASSWORD, type:'branch', name: trimmed + ' — ' + sd.name, branch:trimmed, branchDept:sd.id};
  });
  addBranchError = '';
  return true;
}
function addDepartment(name, canEnter){
  const trimmed = name.trim();
  if(!trimmed){ addDeptError = 'Enter a department name.'; return false; }
  if(DEPARTMENTS.some(d=>d.name.toLowerCase()===trimmed.toLowerCase())){ addDeptError = 'A department with that name already exists.'; return false; }
  let id = slugify(trimmed);
  let suffix = 2;
  while(DEPARTMENTS.some(d=>d.id===id)){ id = slugify(trimmed) + '-' + suffix; suffix++; }
  DEPARTMENTS.push({id, name:trimmed, code:codeFromName(trimmed), canEnterBills: !!canEnter});
  users[id] = {password:DEFAULT_PASSWORD, type:'department', name:trimmed};
  addDeptError = '';
  return true;
}
async function saveOrgStructure(){
  return await saveWithRetry(()=>kvSet(ORG_KEY, {branches:BRANCHES, departments:DEPARTMENTS}));
}

  bills = [];

  return await saveBills();
}

/* ---------------- persistence ---------------- */
const TIMED_OUT = Symbol('timed-out');
function withTimeout(promise, ms=7000){
  return new Promise((resolve)=>{
    const timer = setTimeout(()=> resolve(TIMED_OUT), ms);
    promise.then(
      (v)=>{ clearTimeout(timer); resolve(v); },
      ()=>{ clearTimeout(timer); resolve(TIMED_OUT); }
    );
  });
}
async function kvGet(key){
  const { data, error } = await sb.from('app_kv').select('value').eq('key', key).maybeSingle();
  if(error){ console.error('Supabase read error', error); return null; }
  return data ? data.value : null;
}
async function kvSet(key, value){
  const { error } = await sb.from('app_kv').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error){ console.error('Supabase write error', error); return false; }
  return true;
}
async function saveWithRetry(fn){
  let ok = await withTimeout(fn());
  if(ok!==true){
    await new Promise(r=>setTimeout(r, 500)); // brief pause, then one retry in case it was a transient blip
    ok = await withTimeout(fn());
  }
  return ok===true;
}
async function loadOrgAndUsers(){
  connectionWarning = '';

  const [orgRes, usersRes] = await Promise.all([
    withTimeout(kvGet(ORG_KEY)),
    withTimeout(kvGet(USERS_KEY))
  ]);

  let v = orgRes;
  if(v===TIMED_OUT){ connectionWarning = 'Could not reach the database.'; v = null; }
  if(v && Array.isArray(v.branches) && Array.isArray(v.departments)){
    BRANCHES = v.branches;
    DEPARTMENTS = v.departments;
  }else{
    BRANCHES = DEFAULT_BRANCHES.slice();
    DEPARTMENTS = DEFAULT_DEPARTMENTS.map(d=>({...d}));
    if(!connectionWarning) await withTimeout(kvSet(ORG_KEY, {branches:BRANCHES, departments:DEPARTMENTS}));
  }
  if(!deptById(deptTab)) deptTab = DEPARTMENTS[0].id;

  let vu = usersRes;
  if(vu===TIMED_OUT){ connectionWarning = connectionWarning || 'Could not reach the database.'; vu = null; }
  if(vu){
    users = vu;
  }else{
    users = buildDefaultUsers();
    if(!connectionWarning) await withTimeout(kvSet(USERS_KEY, users));
  }

  dataLoaded = true;
}
async function loadBills(){
  const vb = await withTimeout(kvGet(BILLS_KEY));
  if(vb===TIMED_OUT){ connectionWarning = connectionWarning || 'Could not reach the database.'; bills = bills || []; }
  else bills = vb || [];
}
async function loadAll(){
  connectionWarning = '';
  await Promise.all([loadOrgAndUsers(), loadBills()]);
}
async function saveBills(){ return await saveWithRetry(()=>kvSet(BILLS_KEY, bills)); }
async function saveUsers(){ return await saveWithRetry(()=>kvSet(USERS_KEY, users)); }

let flashTimer=null;
function flashNotice(msg, isError){
  const el = document.getElementById('flashNotice');
  if(!el) return;
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ---------------- bill mutations ---------------- */
function setDueDate(bill){
  bill.dueAt = new Date(Date.now() + APPROVAL_SLA_DAYS*24*60*60*1000).toISOString();
}
function dueInfo(bill){
  if(bill.status!=='with_department' || !bill.dueAt) return null;
  const diffMs = new Date(bill.dueAt) - Date.now();
  const diffDays = Math.ceil(diffMs / (24*60*60*1000));
  if(diffDays < 0) return {label:'Overdue by ' + Math.abs(diffDays) + ' day' + (Math.abs(diffDays)===1?'':'s'), cls:'overdue'};
  if(diffDays === 0) return {label:'Due today', cls:'duesoon'};
  if(diffDays === 1) return {label:'Due tomorrow', cls:'duesoon'};
  return {label:'Due in ' + diffDays + ' days', cls:'ontrack'};
}
function submitBill(data){
  const bill = {
    id: uid('BL'),
    billNo: data.billNo,
    branch: session.name,
    originType: session.type,                                  // 'branch' or 'department'
    originId: session.type==='branch' ? session.name : session.id,
    vendor: data.vendor,
    amount: parseFloat(data.amount),
    billDate: data.billDate,
    description: data.description,
    currentHolder: data.department,
    status: 'with_department',
    acknowledged: false,
    createdAt: new Date().toISOString(),
    dueAt: new Date(Date.now() + APPROVAL_SLA_DAYS*24*60*60*1000).toISOString(),
    history: [{
      actorType: session.type, actorName:session.name, actorDeptId: session.type==='department' ? session.id : null,
      action:'submitted', toDept:data.department, remarks: data.remarks||'',
      at: new Date().toISOString()
    }]
  };
  bills.unshift(bill);
}
/* ---------------- excel import ---------------- */
function excelDateToStr(v){
  if(v instanceof Date && !isNaN(v)){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number' && window.XLSX && XLSX.SSF){
    try{
      const d = XLSX.SSF.parse_date_code(v);
      if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    }catch(e){}
  }
  if(typeof v === 'string'){
    const s = v.trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if(s){
      const parsed = new Date(s);
      if(!isNaN(parsed)) return excelDateToStr(parsed);
    }
  }
  return null;
}
function validateImportRow(raw){
  const errors=[];
  const billNo = String(raw['Bill No']||'').trim();
  const vendor = String(raw['Party']||'').trim();
  const departmentRaw = String(raw['Department']||'').trim();
  const amount = parseFloat(raw['Amount']);
  const billDate = excelDateToStr(raw['Bill Date']);
  const description = String(raw['Description']||'').trim();
  const remarks = String(raw['Remarks']||'').trim();
  const department = DEPARTMENTS.find(d=> d.name.toLowerCase()===departmentRaw.toLowerCase() || d.code.toLowerCase()===departmentRaw.toLowerCase());

  if(!billNo) errors.push('Missing Bill No');
  if(!vendor) errors.push('Missing Party');
  if(isNaN(amount) || amount<=0) errors.push('Invalid Amount');
  if(!billDate) errors.push('Invalid or missing Bill Date');
  if(!department) errors.push('Department must be one of: ' + DEPARTMENTS.map(d=>d.name).join(', '));
  else if(session.type==='department' && department.id===session.id) errors.push('Cannot send a bill to your own department');
  if(!description) errors.push('Missing Description');

  return {
    raw,
    parsed:{billNo, vendor, amount, billDate, department: department?department.id:'', departmentName: department?department.name:departmentRaw, description, remarks},
    errors,
    valid: errors.length===0
  };
}
function handleExcelFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      importRows = rows.map(validateImportRow);
      importFileName = file.name;
      if(!importRows.length) flashNotice('That file has no rows to import.', true);
    }catch(err){
      importRows = [];
      importFileName = '';
      flashNotice('Could not read that file. Make sure it is a .xlsx or .xls file saved from the template.', true);
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}
function downloadTemplate(){
  const headers = ['Bill No','Bill Date','Party','Amount','Department','Description','Remarks'];
  const example = ['INV-1001','09-07-2026','Sree Traders',1250,'Marketing Department','Diwali hoarding printing','Urgent - festival deadline'];
  const ws = XLSX.utils.aoa_to_sheet([headers, example]);
  ws['!cols'] = [{wch:14},{wch:12},{wch:22},{wch:12},{wch:20},{wch:34},{wch:26}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Bills');
  XLSX.writeFile(wb, 'bill-import-template.xlsx');
}
function clearImport(){ importRows=[]; importFileName=''; render(); }
async function confirmImport(){
  const validRows = importRows.filter(r=>r.valid);
  if(!validRows.length) return;
  validRows.forEach(r=>{
    const data = {...r.parsed};
    data.remarks = data.remarks ? data.remarks + ' (Imported from Excel)' : 'Imported from Excel';
    submitBill(data);
  });
  const skipped = importRows.length - validRows.length;
  importRows = [];
  importFileName = '';
  await persistAndRender(
    `Imported ${validRows.length} bill${validRows.length===1?'':'s'}.` +
    (skipped ? ` ${skipped} row${skipped===1?'':'s'} skipped — fix and re-upload if needed.` : '')
  );
}

function addHistory(bill, action, toDept, remarks){
  bill.history.push({
    actorType:session.type==='admin' ? 'admin' : session.type,
    actorName:session.name,
    actorDeptId: session.type==='department' ? session.id : null,
    action, toDept: toDept||null, remarks: remarks||'',
    at: new Date().toISOString()
  });
}
function markForward(billId, toDeptId, remarks){
  const bill = bills.find(b=>b.id===billId);
  // GM's only outlet is Finance, who takes it to Management for approval
  if(session.type==='department' && session.id==='gm') toDeptId = 'finance';
  bill.currentHolder = toDeptId;
  bill.status = 'with_department';
  bill.acknowledged = false;
  setDueDate(bill);
  addHistory(bill, 'marked_to', toDeptId, remarks);
}
function acknowledgeBill(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  bill.acknowledged = true;
  addHistory(bill, 'acknowledged', null, remarks);
}
function returnBillTo(billId, targetType, targetId, remarks){
  const bill = bills.find(b=>b.id===billId);
  bill.returnedFromDept = bill.currentHolder; // remember who sent it back, so a resubmit goes right back to them
  bill.status = 'returned_to_branch';
  bill.currentHolder = targetType==='branch' ? ('branch:'+targetId) : ('dept-return:'+targetId);
  bill.dueAt = null;
  bill.acknowledged = false;
  addHistory(bill, 'returned_to_branch', targetId, remarks);
}
function resubmit(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  const backTo = bill.returnedFromDept || DEPARTMENTS[0].id;
  bill.status = 'with_department';
  bill.acknowledged = false;
  bill.currentHolder = backTo;
  setDueDate(bill);
  addHistory(bill, 'resubmitted', backTo, remarks);
}
function approveBill(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  bill.status = 'approved';
  bill.currentHolder = 'finance'; // final approval routes straight to Finance for payment
  bill.dueAt = null;
  bill.acknowledged = false;
  addHistory(bill, 'approved', 'finance', remarks);
}
function rejectBill(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  bill.returnedFromDept = bill.currentHolder;
  bill.status = 'rejected';
  bill.dueAt = null;
  bill.acknowledged = false;
  addHistory(bill, 'rejected', null, remarks);
}
function resubmitRejected(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  const backTo = bill.returnedFromDept || DEPARTMENTS[0].id;
  bill.status = 'with_department';
  bill.acknowledged = false;
  bill.currentHolder = backTo;
  setDueDate(bill);
  addHistory(bill, 'resubmitted', backTo, remarks);
}
function recordPayment(billId, data){
  const bill = bills.find(b=>b.id===billId);
  bill.status = 'paid';
  bill.payment = {
    type: data.paymentType,
    bankAccount: data.bankAccount,
    reference: data.reference || '',
    paidOn: data.paidOn,
    recordedBy: session.name,
    recordedAt: new Date().toISOString()
  };
  addHistory(bill, 'paid', null, `Paid via ${data.paymentType} from ${data.bankAccount} on ${data.paidOn}` + (data.reference ? ` (Ref: ${data.reference})` : ''));
}
function sendToBranchForPayment(billId, remarks){
  const bill = bills.find(b=>b.id===billId);
  bill.paymentAtBranch = true;
  bill.currentHolder = 'branch:'+bill.originId;
  bill.acknowledged = false;
  addHistory(bill, 'sent_for_branch_payment', null, remarks);
}
function editBill(billId, data){
  const bill = bills.find(b=>b.id===billId);
  const changes = [];
  if(bill.billNo !== data.billNo) changes.push(`Bill No "${bill.billNo}" → "${data.billNo}"`);
  if(bill.billDate !== data.billDate) changes.push(`Bill Date ${fmtDateOnly(bill.billDate)} → ${fmtDateOnly(data.billDate)}`);
  if(bill.vendor !== data.vendor) changes.push(`Party "${bill.vendor}" → "${data.vendor}"`);
  const newAmount = parseFloat(data.amount);
  if(bill.amount !== newAmount) changes.push(`Amount ${fmtMoney(bill.amount)} → ${fmtMoney(newAmount)}`);
  if(bill.description !== data.description) changes.push('Description updated');

  bill.billNo = data.billNo;
  bill.billDate = data.billDate;
  bill.vendor = data.vendor;
  bill.amount = newAmount;
  bill.description = data.description;

  if(changes.length) addHistory(bill, 'edited', null, changes.join(' · '));
}
async function persistAndRender(msg){
  const ok = await saveBills();
  render();
  if(!ok){
    flashNotice('⚠ Could not save this to the shared register — check your connection and try again. Refresh to see the real current state.', true);
  }else if(msg){
    flashNotice(msg);
  }
}

/* ---------------- query helpers ---------------- */
function isInMyQueue(bill){
  if(session.type==='department'){
    const asProcessor = bill.status==='with_department' && bill.currentHolder===session.id;
    const asReturnRecipient = bill.status==='returned_to_branch' && bill.currentHolder==='dept-return:'+session.id;
    const asRejectedOrigin = bill.status==='rejected' && bill.originType==='department' && bill.originId===session.id;
    const asPaymentHandler = session.id==='finance' && bill.status==='approved' && bill.currentHolder==='finance';
    return asProcessor || asReturnRecipient || asRejectedOrigin || asPaymentHandler;
  }
  if(session.type==='branch'){
    const asReturnRecipient = bill.status==='returned_to_branch' && bill.currentHolder==='branch:'+session.name;
    const asRejectedOrigin = bill.status==='rejected' && bill.originType==='branch' && bill.originId===session.name;
    const asPaymentHandler = bill.status==='approved' && bill.currentHolder==='branch:'+session.name;
    return asReturnRecipient || asRejectedOrigin || asPaymentHandler;
  }
  return false;
}
function isMyBill(bill){
  if(session.type==='branch') return bill.originType==='branch' && bill.originId===session.name;
  if(session.type==='department') return bill.originType==='department' && bill.originId===session.id;
  return false;
}
function canEditBill(bill){
  if(bill.status==='approved' || bill.status==='paid') return false;
  if(isMyBill(bill)) return true;
  if(session.type==='department' && (session.id==='finance' || session.id==='audit')) return true;
  return false;
}
function isProcessorItem(bill){
  return session.type==='department' && bill.status==='with_department' && bill.currentHolder===session.id && bill.acknowledged;
}
function isIncomingItem(bill){
  if(!isInMyQueue(bill)) return false;
  return !bill.acknowledged;
}
function isPaymentItem(bill){
  if(bill.status!=='approved') return false;
  if(session.type==='department') return session.id==='finance' && bill.currentHolder==='finance';
  if(session.type==='branch') return bill.currentHolder==='branch:'+session.name;
  return false;
}
function myProcessorBillIds(){
  return bills.filter(isProcessorItem).map(b=>b.id);
}
function visibleBills(){
  // scope: branches only ever see bills they personally submitted. departments & admin see everything.
  if(session.type==='branch') return bills.filter(b=>b.originType==='branch' && b.originId===session.name);
  return bills.slice();
}
function statusInfo(bill){
  if(bill.status==='paid') return {label:'Paid', cls:'approved'};
  if(bill.status==='approved'){
    if(bill.currentHolder && bill.currentHolder.startsWith('branch:')) return {label:'Approved — Payment Pending (Branch)', cls:'hold'};
    return {label:'Approved — Payment Pending (Finance)', cls:'hold'};
  }
  if(bill.status==='rejected') return {label:'Rejected by '+(deptById(bill.returnedFromDept)?.name || 'department'), cls:'rejected'};
  if(bill.status==='returned_to_branch') return {label:'Returned to '+bill.branch, cls:'hold'};
  const d = deptById(bill.currentHolder);
  const base = 'With ' + (d?d.name:bill.currentHolder);
  return {label: bill.acknowledged ? base : base + ' (unacknowledged)', cls:'pending'};
}
function actionClass(action){
  if(action==='approved' || action==='paid') return 'c-approved';
  if(action==='rejected') return 'c-rejected';
  if(action==='returned_to_branch' || action==='sent_for_branch_payment') return 'c-hold';
  return 'c-pending';
}
function actionLabel(h){
  switch(h.action){
    case 'submitted': return 'Submitted to ' + (deptById(h.toDept)?.name || h.toDept);
    case 'acknowledged': return 'Receipt acknowledged';
    case 'resubmitted': return 'Resubmitted to ' + (deptById(h.toDept)?.name || h.toDept);
    case 'verified_and_marked': return 'Verified, marked to ' + (deptById(h.toDept)?.name || h.toDept);
    case 'marked_to': return 'Marked to ' + (deptById(h.toDept)?.name || h.toDept);
    case 'returned_to_branch': return h.toDept ? ('Returned to ' + (deptById(h.toDept)?.name || h.toDept) + ' for correction') : 'Returned for correction';
    case 'approved': return 'Approved — sent to Finance for payment';
    case 'rejected': return 'Rejected';
    case 'sent_for_branch_payment': return 'Sent to branch for payment';
    case 'paid': return 'Payment recorded';
    case 'edited': return 'Bill details edited';
    default: return h.action;
  }
}
function stampCode(h){
  if(h.actorType==='branch') return h.actorName.slice(0,3).toUpperCase();
  if(h.actorType==='admin') return 'ADM';
  const d = deptById(h.actorDeptId);
  return d ? d.code : '???';
}

/* ================= LOGIN SCREEN ================= */
function renderLogin(){
  const showSpecific = loginType==='branch' || loginType==='department';
  const showBranchDept = loginType==='branch' && loginSpecific;
  const showPassword = loginType==='admin'
    || (loginType==='department' && loginSpecific)
    || (loginType==='branch' && loginSpecific && loginBranchDept);

  let specificOptionsHtml = '';
  if(loginType==='branch'){
    specificOptionsHtml = BRANCHES.map(b=>`<option value="${escapeHtml(b)}" ${loginSpecific===b?'selected':''}>${escapeHtml(b)}</option>`).join('');
  }else if(loginType==='department'){
    specificOptionsHtml = DEPARTMENTS.map(d=>`<option value="${d.id}" ${loginSpecific===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('');
  }
  const branchDeptOptionsHtml = BRANCH_SUBDEPTS.map(sd=>`<option value="${sd.id}" ${loginBranchDept===sd.id?'selected':''}>${escapeHtml(sd.name)}</option>`).join('');

  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="surface login-card">
        <div class="login-brand">
          <span class="brand-icon login-brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M9 13.5l2 2 4-4.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-sub">Bill Movement &amp; Approval Register</span>
        </div>
        ${connectionWarning ? `<div class="login-error">${escapeHtml(connectionWarning)} Showing default logins for now — nothing will be saved until this is fixed. Check that SUPABASE_URL / SUPABASE_ANON_KEY in the code are correct, that supabase-schema.sql has been run, and that the Supabase project is active.</div>` : ''}
        ${loginError ? `<div class="login-error">${escapeHtml(loginError)}</div>` : ''}
        <form id="loginForm">
          <div class="login-field">
            <label>Login type</label>
            <select id="loginTypeSelect">
              <option value="" disabled ${!loginType?'selected':''}>Select login type</option>
              <option value="branch" ${loginType==='branch'?'selected':''}>Branch</option>
              <option value="department" ${loginType==='department'?'selected':''}>Corporate</option>
              <option value="admin" ${loginType==='admin'?'selected':''}>Admin</option>
            </select>
          </div>
          ${showSpecific ? `
          <div class="login-field">
            <label>${loginType==='branch' ? 'Select branch' : 'Select corporate department'}</label>
            <select id="loginSpecificSelect">
              <option value="" disabled ${!loginSpecific?'selected':''}>Select ${loginType==='branch' ? 'branch' : 'department'}</option>
              ${specificOptionsHtml}
            </select>
          </div>` : ''}
          ${showBranchDept ? `
          <div class="login-field">
            <label>Which department of the branch?</label>
            <select id="loginBranchDeptSelect">
              <option value="" disabled ${!loginBranchDept?'selected':''}>Select department</option>
              ${branchDeptOptionsHtml}
            </select>
          </div>` : ''}
          ${showPassword ? `
          <div class="login-field">
            <label>Password</label>
            <input type="password" id="loginPass" required placeholder="Password">
          </div>
          <button type="submit" class="primary wide">Log in</button>
          ` : ''}
        </form>
        <p class="login-hint">Each branch department, corporate department and the admin account has its own login.<br>Default password for every login is <b>0000</b> until changed.</p>
      </div>
    </div>
  `;

  document.getElementById('loginTypeSelect').addEventListener('change', (e)=>{
    loginType = e.target.value;
    loginSpecific = '';
    loginBranchDept = '';
    loginError = '';
    renderLogin();
  });
  const specificEl = document.getElementById('loginSpecificSelect');
  if(specificEl){
    specificEl.addEventListener('change', (e)=>{
      loginSpecific = e.target.value;
      loginBranchDept = '';
      loginError = '';
      renderLogin();
    });
  }
  const branchDeptEl = document.getElementById('loginBranchDeptSelect');
  if(branchDeptEl){
    branchDeptEl.addEventListener('change', (e)=>{
      loginBranchDept = e.target.value;
      loginError = '';
      renderLogin();
    });
  }
  const form = document.getElementById('loginForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!dataLoaded){
        loginError = 'Still connecting — please wait a moment and try again.';
        renderLogin();
        return;
      }
      let uname = '';
      if(loginType==='admin') uname = 'admin';
      else if(loginType==='department') uname = loginSpecific;
      else if(loginType==='branch') uname = loginSpecific + '::' + loginBranchDept;
      if(!uname){ loginError = 'Complete the selection above first.'; renderLogin(); return; }
      if(!users[uname]){ loginError = 'That login could not be found. Try refreshing the page.'; renderLogin(); return; }
      const passEl = document.getElementById('loginPass');
      const pass = passEl ? passEl.value : '';
      const rec = users[uname];
      if(!rec || rec.password !== pass){
        loginError = 'Incorrect selection or password.';
        renderLogin();
        return;
      }
      loginError = '';
      session = {id: uname, type: rec.type, name: rec.name};
      tab = 'dashboard';
      loginType = ''; loginSpecific = ''; loginBranchDept = '';
      const submitBtn = form.querySelector('button[type="submit"]');
      if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Logging in…'; }
      if(billsPrefetch) await billsPrefetch;
      renderApp();
    });
  }
}

          </div>
        </div>
        <div class="topbar-actions">

          <button class="ghost small" id="btnChangePw">Change password</button>
          <span class="role-pill">${roleLabel(session.type)}</span>
          <span class="user-pill">${escapeHtml(session.name)}</span>
          <button class="ghost small" id="btnLogout">Log out</button>
        </div>
      </header>

      </nav>

      <div id="pwPanelWrap"></div>
      <main id="content"></main>

      <footer>
        Shared register — every entry and mark-forward made here is visible to everyone permitted to see it: a showroom
        only sees bills it has logged itself; departments and the admin login see bills as they move across branches.
        Logins and passwords for this demo are kept in the same shared storage as the bills (not encrypted) — change
        every login away from the default <b>0000</b> before relying on this for real records.
      </footer>
    </div>
  `;

  document.getElementById('btnLogout').addEventListener('click', ()=>{
    session = null; pwPanelOpen=false; pwError=''; importRows=[]; importFileName='';

    renderLogin();
  });
  document.getElementById('btnChangePw').addEventListener('click', ()=>{
    pwPanelOpen = !pwPanelOpen; pwError='';
    render();
  });
  document.getElementById('btnRefreshData').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Refreshing…';
    await loadAll();
    render();
    btn.disabled = false;
    btn.innerHTML = original;
    flashNotice(connectionWarning ? connectionWarning + ' Showing the last data available.' : 'Up to date.', !!connectionWarning);
  });
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    tab = btn.dataset.tab;
    expandedId = null;
    selectedBillIds.clear();
    addBranchError = ''; addDeptError = '';
    render();
  });

  render();
}

/* ---------------- master render ---------------- */
function render(){
  if(!session) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  const pendingN = bills.filter(isIncomingItem).length;
  const pendingEl = document.getElementById('pendingCount');
  if(pendingEl) pendingEl.textContent = pendingN;
  const queueN = bills.filter(b=> isInMyQueue(b) && !isIncomingItem(b)).length;
  const qEl = document.getElementById('queueCount');
  if(qEl) qEl.textContent = queueN;

  const pwWrap = document.getElementById('pwPanelWrap');
  pwWrap.innerHTML = pwPanelOpen ? renderPwPanel() : '';
  if(pwPanelOpen) attachPwHandlers();

  const content = document.getElementById('content');
  if(!dataLoaded){
    content.innerHTML = `<div class="surface empty"><b>Loading register…</b>Fetching the shared bill log.</div>`;
    return;
  }
  if(tab==='dashboard') content.innerHTML = renderDashboard();
  else if(tab==='new') content.innerHTML = renderNewBill();
  else if(tab==='pending' && session.type!=='admin') content.innerHTML = renderPendingReceive();
  else if(tab==='queue') content.innerHTML = renderQueue();
  else if(tab==='departments') content.innerHTML = renderDepartments();
  else if(tab==='track') content.innerHTML = renderTrack();
  else if(tab==='mybills') content.innerHTML = renderMyLoggedBills();
  else if(tab==='users' && session.type==='admin') content.innerHTML = renderUsers();

  attachHandlers();
}

/* ---------------- change password panel ---------------- */
function renderPwPanel(){
  return `
    <div class="surface pw-panel" style="margin-bottom:22px;">
      <h4 class="section-h">Change password — ${escapeHtml(session.name)}</h4>
      ${pwError ? `<div class="notice error show">${escapeHtml(pwError)}</div>` : ''}
      <div class="field"><label>Current password</label><input type="password" id="pwCurrent"></div>
      <div class="field"><label>New password</label><input type="password" id="pwNew"></div>
      <div class="field"><label>Confirm new password</label><input type="password" id="pwConfirm"></div>
      <div class="btn-row">
        <button class="primary small" id="pwSave">Save password</button>
        <button class="ghost small" id="pwCancel">Cancel</button>
      </div>
    </div>
  `;
}
function attachPwHandlers(){
  document.getElementById('pwCancel').addEventListener('click', ()=>{ pwPanelOpen=false; render(); });
  document.getElementById('pwSave').addEventListener('click', async ()=>{
    const cur = document.getElementById('pwCurrent').value;
    const nw = document.getElementById('pwNew').value;
    const cf = document.getElementById('pwConfirm').value;
    if(users[session.id].password !== cur){ pwError='Current password is incorrect.'; render(); return; }
    if(!nw || nw.length<4){ pwError='New password must be at least 4 characters.'; render(); return; }
    if(nw !== cf){ pwError='New password and confirmation do not match.'; render(); return; }
    users[session.id].password = nw;
    const ok = await saveUsers();
    pwPanelOpen = false; pwError='';
    render();
    flashGlobal(ok ? 'Password updated.' : '⚠ Could not save — check your connection and try again.', !ok);
  });
}
function flashGlobal(msg, isError){
  // brief top-of-content confirmation when no in-panel notice exists
  const content = document.getElementById('content');
  if(!content) return;
  const banner = document.createElement('div');
  banner.className = 'notice show' + (isError ? ' error' : '');
  banner.textContent = msg;
  content.prepend(banner);
  setTimeout(()=>banner.remove(), 3000);
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const scoped = visibleBills();
  const total = scoped.length;
  const pending = scoped.filter(b=>b.status==='with_department').length;
  const held = scoped.filter(b=>b.status==='returned_to_branch').length;
  const paymentPending = scoped.filter(b=>b.status==='approved').length;
  const paid = scoped.filter(b=>b.status==='paid').length;
  const rejected = scoped.filter(b=>b.status==='rejected').length;
  const overdue = scoped.filter(b=>dueInfo(b)?.cls==='overdue').length;

  let loadSection = '';
  if(session.type!=='branch'){
    const loadRows = DEPARTMENTS.map(d=>{
      const deptBills = scoped.filter(b=>b.status==='with_department' && b.currentHolder===d.id);
      const n = deptBills.length;
      const overdueN = deptBills.filter(b=>dueInfo(b)?.cls==='overdue').length;
      return `<div class="surface dept-load-item" data-goto-dept="${d.id}"><span class="name">${d.name}</span><span class="n">${n}${overdueN?` <span style="color:var(--rejected);">· ${overdueN} overdue</span>`:''}</span></div>`;
    }).join('');
    loadSection = `<h3 class="section-h">Bills currently held, by department <span class="form-note">— each department has ${APPROVAL_SLA_DAYS} days to act on a bill</span></h3><div class="dept-load">${loadRows}</div>`;
  }

  const feedItems = scoped
    .flatMap(b=>b.history.map(h=>({...h, billNo:b.billNo})))
    .sort((a,b)=> new Date(b.at)-new Date(a.at))
    .slice(0,10);

  const feedHtml = feedItems.length ? feedItems.map(h=>`
    <div class="feed-item">
      <span class="time">${fmtDateTime(h.at)}</span>
      <span><b>${escapeHtml(h.actorName)}</b> — ${actionLabel(h)} <span style="color:var(--ink-soft)">on bill</span> <span style="font-family:'IBM Plex Mono',monospace">${escapeHtml(h.billNo)}</span></span>
    </div>
  `).join('') : `<div class="empty">No activity yet.</div>`;

  const introText = session.type==='branch'
    ? `Everything ${escapeHtml(session.name)} has logged into the register.`
    : `Everything moving through the register, at a glance.`;

  return `
    <h2 class="panel-title">Register overview</h2>
    <p class="panel-sub">${introText} <span class="form-note">Click any card to see the bills behind it.</span></p>
    <div class="stat-grid">
      <div class="surface stat-card clickable" data-goto-status="all"><div class="num">${total}</div><div class="lbl">Total bills logged</div></div>
      <div class="surface stat-card pending clickable" data-goto-status="with_department"><div class="num">${pending}</div><div class="lbl">With a department</div></div>
      <div class="surface stat-card rejected clickable" data-goto-status="overdue"><div class="num">${overdue}</div><div class="lbl">Overdue (past ${APPROVAL_SLA_DAYS} days)</div></div>
      <div class="surface stat-card hold clickable" data-goto-status="returned_to_branch"><div class="num">${held}</div><div class="lbl">Returned to branch</div></div>
      <div class="surface stat-card hold clickable" data-goto-status="approved"><div class="num">${paymentPending}</div><div class="lbl">Approved — payment pending</div></div>
      <div class="surface stat-card approved clickable" data-goto-status="paid"><div class="num">${paid}</div><div class="lbl">Paid</div></div>
      <div class="surface stat-card rejected clickable" data-goto-status="rejected"><div class="num">${rejected}</div><div class="lbl">Rejected</div></div>
    </div>
    ${loadSection}
    <h3 class="section-h">Recent movement</h3>
    <div class="surface feed">${feedHtml}</div>
  `;
}

        <label>Amount (₹)</label>

        <label>Send to Department</label>

        <label>Purpose / Description</label>
        <textarea name="description" required placeholder="What is this bill for?"></textarea>
      </div>
      <div class="field full">
        <label>Remarks <span class="hint">— optional note for whoever receives it</span></label>
        <textarea name="remarks" placeholder="Any context the receiving department should know"></textarea>
      </div>

function renderImportPreview(){
  if(!importRows.length) return '';
  const validCount = importRows.filter(r=>r.valid).length;
  const rowsHtml = importRows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(r.parsed.billNo || '—')}</td>
      <td>${escapeHtml(r.parsed.vendor || '—')}</td>
      <td>${isNaN(r.parsed.amount) ? '—' : fmtMoney(r.parsed.amount)}</td>
      <td>${r.parsed.billDate || '—'}</td>
      <td>${escapeHtml(r.parsed.departmentName || '—')}</td>
      <td>${r.valid ? '<span class="pill approved">Valid</span>' : '<span class="pill rejected">Error</span>'}</td>
    </tr>
    ${!r.valid ? `<tr><td></td><td colspan="6" style="color:var(--rejected); font-size:12px; padding:0 18px 11px 18px;">${escapeHtml(r.errors.join('; '))}</td></tr>` : ''}

  return `
    <div style="overflow-x:auto; margin-top:14px; border:1px solid var(--rule); border-radius:6px;">
      <table class="user-table">
        <thead><tr><th>Row</th><th>Bill No</th><th>Party</th><th>Amount</th><th>Date</th><th>Department</th><th>Status</th></tr></thead>

/* ---------------- bulk mark bar ---------------- */
function bulkMarkBar(eligibleIds){
  if(session.type!=='department' || !eligibleIds.length) return '';
  const otherDepts = DEPARTMENTS.filter(d=>d.id!==session.id);
  const selectedCount = eligibleIds.filter(id=>selectedBillIds.has(id)).length;
  const allSelected = selectedCount>0 && selectedCount===eligibleIds.length;
  return `
    <div class="surface bulk-bar">
      <label class="bulk-select-all">
        <input type="checkbox" id="selectAllBills" ${allSelected?'checked':''}>
        Select all (${eligibleIds.length})
      </label>
      <span class="form-note">${selectedCount} selected</span>
      <select id="bulkMarkSelect" class="bulk-select">
        ${otherDepts.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}
      </select>
      <input type="text" id="bulkRemark" placeholder="Remarks (applied to all selected)" class="bulk-remark">
      <button class="primary small" id="btnBulkMark" ${selectedCount===0?'disabled':''}>Mark ${selectedCount||''} selected on</button>
    </div>
  `;
}

/* ---------------- pending to receive ---------------- */
function renderPendingReceive(){
  const incoming = bills.filter(isIncomingItem).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const subText = 'Bills freshly arriving here — whether newly assigned to you, returned to you for correction, or approved and sent to you for payment — land here first, so nothing sits unseen. Acknowledge receipt and it moves into My Queue.';
  const emptyText = `Nothing is currently waiting for ${escapeHtml(session.name)} to acknowledge.`;

  if(!incoming.length){
    return `
      <h2 class="panel-title">Pending to Receive — ${session.name}</h2>
      <p class="panel-sub">${subText}</p>
      <div id="flashNotice" class="notice"></div>
      <div class="surface empty"><b>Nothing waiting</b>${emptyText}</div>
    `;
  }

  return `
    <h2 class="panel-title">Pending to Receive — ${session.name}</h2>
    <p class="panel-sub">${subText}</p>
    <div id="flashNotice" class="notice"></div>
    <div class="surface">${incoming.map(b=>renderBillCard(b, true, false)).join('')}</div>
  `;
}

/* ---------------- queue ---------------- */
function renderQueue(){
  const mine = bills.filter(b=> isInMyQueue(b) && !isIncomingItem(b)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const label = session.type==='branch' ? session.name + ' (Branch)' : session.name;

  if(!mine.length){
    return `
      <h2 class="panel-title">My Queue — ${label}</h2>
      <p class="panel-sub">Bills currently waiting on you.</p>
      <div id="flashNotice" class="notice"></div>
      <div class="surface empty"><b>Queue is clear</b>No bills are currently waiting on ${escapeHtml(label)}.</div>
    `;
  }

  const inProgress = mine.filter(isProcessorItem);
  const payment = mine.filter(isPaymentItem);
  const needsAttention = mine.filter(b => !isProcessorItem(b) && !isPaymentItem(b));
  const bulkIds = inProgress.map(b=>b.id);

  let sections = '';
  if(payment.length){
    sections += `
      <h3 class="section-h" style="margin-top:4px;">Approved — ready for payment (${payment.length})</h3>
      <div class="surface" style="margin-bottom:24px;">${payment.map(b=>renderBillCard(b, true, false)).join('')}</div>
    `;
  }
  if(needsAttention.length){
    sections += `
      <h3 class="section-h">Needs your attention (${needsAttention.length})</h3>
      <div class="surface" style="margin-bottom:24px;">${needsAttention.map(b=>renderBillCard(b, true, false)).join('')}</div>
    `;
  }
  if(inProgress.length){
    sections += `
      <h3 class="section-h">In progress (${inProgress.length})</h3>
      ${bulkMarkBar(bulkIds)}
      <div class="surface">${inProgress.map(b=>renderBillCard(b, true, bulkIds.includes(b.id))).join('')}</div>
    `;
  }

  return `
    <h2 class="panel-title">My Queue — ${label}</h2>
    <p class="panel-sub">Verify, add remarks, and mark them on — tick a few and mark them on together.</p>
    <div id="flashNotice" class="notice"></div>
    ${sections}
  `;
}

function filteredTrackBills(){
  const q = trackFilters.q.trim().toLowerCase();
  let list = visibleBills();
  if(q) list = list.filter(b=> b.billNo.toLowerCase().includes(q) || b.vendor.toLowerCase().includes(q) || b.branch.toLowerCase().includes(q));
  if(trackFilters.status==='overdue'){
    list = list.filter(b=> dueInfo(b)?.cls==='overdue');
  }else if(trackFilters.status!=='all'){
    list = list.filter(b=>b.status===trackFilters.status);
  }
  if(session.type!=='branch' && trackFilters.dept!=='all') list = list.filter(b=> b.status==='with_department' && b.currentHolder===trackFilters.dept);
  if(session.type!=='branch' && trackFilters.branch!=='all') list = list.filter(b=> b.originType==='branch' && b.originId===trackFilters.branch);
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return list;
}
function exportBillsToCSV(list){
  const headers = ['Bill No','Party','Amount','Bill Date','Status','Branch / Origin','Logged On'];
  const rows = list.map(b=>[b.billNo, b.vendor, b.amount, b.billDate, statusInfo(b).label, b.branch, fmtDate(b.createdAt)]);
  const csv = [headers, ...rows].map(r=> r.map(cell=>{
    const s = String(cell==null?'':cell).replace(/"/g,'""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bills-export-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderBillCard(bill, actionable, selectable){
  const st = statusInfo(bill);
  const due = dueInfo(bill);
  const open = expandedId===bill.id;
  const editing = editingBillId===bill.id;

  const trailHtml = bill.history.map(h=>`
    <div class="trail-node">
      <div class="stamp ${actionClass(h.action)}">${escapeHtml(stampCode(h))}</div>
      <div class="trail-label">${actionLabel(h)}</div>
      <div class="trail-date">${fmtDate(h.at)}</div>
      ${h.remarks ? `<div class="trail-remark">"${escapeHtml(h.remarks)}"</div>` : ''}
    </div>
  `).join('');

  let actionHtml = '';
  if(actionable){
    const isReturnRecipient = session.type==='department' && bill.status==='returned_to_branch' && bill.currentHolder==='dept-return:'+session.id;
    const isRejectedOrigin = session.type==='department' && bill.status==='rejected' && bill.originType==='department' && bill.originId===session.id;
    const originReturnedToMe = isReturnRecipient || isRejectedOrigin;
    const needsAcknowledgment = isIncomingItem(bill);
    const isPayment = isPaymentItem(bill);

    if(needsAcknowledgment){
      let howItArrived, whatComesNext;
      if(bill.status==='rejected'){ howItArrived = 'was just rejected back to'; whatComesNext = 'fixing and resubmitting it'; }
      else if(bill.status==='returned_to_branch'){ howItArrived = 'was just returned to'; whatComesNext = 'fixing and resubmitting it'; }
      else if(bill.status==='approved'){ howItArrived = 'was just approved by Management and sent to'; whatComesNext = 'recording the payment'; }
      else { howItArrived = 'was just marked to'; whatComesNext = 'verifying and marking it on'; }
      actionHtml = `
        <div class="action-box ack-box">
          <h4 class="section-h">New — needs acknowledgment</h4>
          <p class="form-note" style="margin:0 0 10px 0;">This bill ${howItArrived} ${escapeHtml(session.name)}. Acknowledge receipt before ${whatComesNext}, so it's never left sitting unseen.</p>
          <div class="action-row">
            <div class="field" style="flex:1;">
              <label>Remarks (optional)</label>
              <input type="text" class="remarkInput" data-bill="${bill.id}" placeholder="Receipt note, if any">
            </div>
          </div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="primary small btnAcknowledge" data-bill="${bill.id}">Acknowledge receipt</button>
          </div>
        </div>
      `;
    }else if(isPayment){
      actionHtml = renderPaymentBox(bill);
    }else if(session.type==='department' && !originReturnedToMe){
      const isGM = session.id==='gm';
      const otherDepts = isGM ? DEPARTMENTS.filter(d=>d.id==='finance') : DEPARTMENTS.filter(d=>d.id!==session.id);
      const isManagement = session.id==='management';

      const returnTargets = [];
      if(bill.originType==='branch'){
        returnTargets.push({value:'branch::'+bill.originId, label: bill.originId + ' — originating branch'});
      }
      DEPARTMENTS.filter(d=>d.id!==session.id).forEach(d=>{
        const isOrigin = bill.originType==='department' && bill.originId===d.id;
        returnTargets.push({value:'dept::'+d.id, label: d.name + (isOrigin ? ' — originating department' : '')});
      });

      actionHtml = `
        <div class="action-box">
          <h4 class="section-h">Action — as ${escapeHtml(session.name)}</h4>
          ${isGM ? `<p class="form-note" style="margin:0 0 10px 0;">GM sign-off routes straight to Finance, who takes it to Management for final approval.</p>` : ''}
          <div class="action-row">
            <div class="field">
              <label>Mark to department</label>
              <select class="markToSelect" data-bill="${bill.id}" ${isGM ? 'disabled':''}>
                ${otherDepts.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="flex:1;">
              <label>Remarks</label>
              <input type="text" class="remarkInput" data-bill="${bill.id}" placeholder="Verification note, reason, instructions…">
            </div>
          </div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="primary small btnMark" data-bill="${bill.id}">${isGM ? 'Send to Finance' : 'Mark on'}</button>
            ${isManagement ? `<button class="ghost small btnApprove" data-bill="${bill.id}" style="border-color:var(--approved); color:var(--approved);">Approve (final)</button>
            <button class="ghost small btnReject" data-bill="${bill.id}" style="border-color:var(--rejected); color:var(--rejected);">Reject</button>` : ''}
            ${canEditBill(bill) ? `<button class="ghost small btnEdit" data-bill="${bill.id}">Edit bill details</button>` : ''}
          </div>
          <div class="action-row" style="margin-top:16px; padding-top:14px; border-top:1px solid var(--rule-strong);">
            <div class="field">
              <label>Return for correction, to</label>
              <select class="returnToSelect" data-bill="${bill.id}">
                ${returnTargets.map(t=>`<option value="${escapeHtml(t.value)}">${escapeHtml(t.label)}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="flex:1;">
              <label>Reason for return</label>
              <input type="text" class="returnRemarkInput" data-bill="${bill.id}" placeholder="What needs fixing?">
            </div>
            <button class="ghost small btnReturn" data-bill="${bill.id}">Return</button>
          </div>
        </div>
      `;
    }else if(session.type==='branch' || originReturnedToMe){
      const backToDept = deptById(bill.returnedFromDept);
      const backToName = backToDept ? backToDept.name : 'the department';
      const wasRejected = bill.status==='rejected';
      actionHtml = `
        <div class="action-box">
          <h4 class="section-h">Action — as ${escapeHtml(session.name)}${session.type==='branch' ? ' (Branch)' : ''}</h4>
          ${wasRejected ? `<p class="form-note" style="margin:0 0 10px 0; color:var(--rejected);">This bill was rejected by ${escapeHtml(backToName)}. Fix it and resubmit, or edit the bill details below first.</p>` : ''}
          <div class="action-row">
            <div class="field" style="flex:1;">
              <label>Note back to ${escapeHtml(backToName)}</label>
              <input type="text" class="remarkInput" data-bill="${bill.id}" placeholder="What was corrected?">
            </div>
          </div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="primary small btnResubmit" data-bill="${bill.id}">Resubmit to ${escapeHtml(backToName)}</button>
            <button class="ghost small btnEdit" data-bill="${bill.id}">Edit bill details</button>
          </div>
        </div>
      `;
    }
  }

  const canEdit = !editing && canEditBill(bill);
  const editBtnHtml = canEdit && !actionable
    ? `<div class="btn-row" style="margin-top:14px;"><button class="ghost small btnEdit" data-bill="${bill.id}">Edit bill details</button></div>`
    : '';

  const paymentInfoHtml = bill.payment ? `

      <b style="color:var(--approved);">Payment recorded</b><br>
      ${escapeHtml(bill.payment.type)} from ${escapeHtml(bill.payment.bankAccount)} on ${fmtDateOnly(bill.payment.paidOn)}

  const bodyHtml = editing ? renderEditForm(bill) : `
    <div class="bill-desc">${escapeHtml(bill.description)}</div>
    ${paymentInfoHtml}
    <h4 class="section-h">Movement trail</h4>
    <div class="trail">${trailHtml}</div>

  return `

      <div class="bill-top" data-toggle="${bill.id}">

          ${selectable ? `<label class="bill-check" onclick="event.stopPropagation()">

          <div class="bill-amount">${fmtMoney(bill.amount)}</div>
          <div style="margin-top:6px;"><span class="pill ${st.cls}">${escapeHtml(st.label)}</span></div>
          ${due ? `<div style="margin-top:6px;"><span class="pill due-${due.cls}">${escapeHtml(due.label)}</span></div>` : ''}
        </div>
      </div>
      <div class="bill-detail ${open?'open':''}" id="detail-${bill.id}">
        ${bodyHtml}
      </div>
